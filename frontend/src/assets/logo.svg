<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 130" width="100%" height="100%">
  <defs>
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="bullGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B91C1C"/>
      <stop offset="50%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>
  </defs>

  <!-- ICON SECTION -->
  <g transform="translate(10, 5)">
    <!-- Top Red Chevron -->
    <path d="M 50 5 L 90 28 L 78 35 L 50 17 L 22 35 L 10 28 Z" fill="url(#redGradient)" />
    
    <!-- Left Dark Bar -->
    <path d="M 10 33 L 22 40 L 22 78 L 10 85 Z" fill="#374151" />
    
    <!-- Right Dark Bar -->
    <path d="M 90 33 L 90 85 L 78 78 L 78 40 Z" fill="#374151" />
    
    <!-- Bottom Red Chevron -->
    <path d="M 50 115 L 10 92 L 22 85 L 50 103 L 78 85 L 90 92 Z" fill="url(#redGradient)" />
    
    <!-- Bull Head Icon in Center -->
    <g transform="translate(20, 38)">
      <!-- Smooth Horns and Head -->
      <path d="M 5 5 C 18 5, 27 12, 30 22 C 30 32, 25 38, 30 46 C 35 38, 30 32, 30 22 C 33 12, 42 5, 55 5 C 44 10, 36 18, 30 26 C 24 18, 16 10, 5 5 Z" fill="url(#bullGrad)" />
    </g>
  </g>

  <!-- TEXT SECTION -->
  <g transform="translate(120, 0)">
    <!-- THE -->
    <text x="0" y="24" font-family="'Times New Roman', Georgia, serif" font-size="12" font-weight="900" fill="#1F2937" letter-spacing="1">THE</text>
    
    <!-- SM GROUPS -->
    <text x="0" y="75" font-family="'Times New Roman', Georgia, serif" font-size="56" font-weight="900" letter-spacing="0.5">
      <tspan fill="#DC2626">S</tspan>
      <tspan fill="#991B1B">M</tspan>
      <tspan fill="#374151"> GROUPS</tspan>
    </text>
    
    <!-- Registered Trademark ® -->
    <text x="345" y="32" font-family="'Times New Roman', Georgia, serif" font-size="18" font-weight="bold" fill="#1F2937">®</text>
    
    <!-- Underline & Slogan -->
    <line x1="0" y1="92" x2="120" y2="92" stroke="#991B1B" stroke-width="1.8" />
    <text x="130" y="96" font-family="'Times New Roman', Georgia, serif" font-size="16" font-weight="bold" fill="#374151" font-style="italic">Behind a thing</text>
    <line x1="240" y1="92" x2="360" y2="92" stroke="#991B1B" stroke-width="1.8" />
  </g>
</svg>
