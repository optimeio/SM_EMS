      <!-- Snout extension -->
      <path d="M 66 78 C 72 85, 75 96, 75 102 C 75 96, 78 85, 84 78 C 78 82, 72 82, 66 78 Z" fill="#900C3F" />
    </g>
  </g>
</svg>