<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" width="100%" height="100%">
  <defs>
    <linearGradient id="favRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ED1C24"/>
      <stop offset="100%" stop-color="#C1121F"/>
    </linearGradient>
    <linearGradient id="favBullGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7A0006"/>
      <stop offset="40%" stop-color="#D90429"/>
      <stop offset="100%" stop-color="#900C3F"/>
    </linearGradient>
  </defs>

  <!-- Transparent / Square Centered Hexagon Emblem -->
  <g transform="translate(0, 0)">
    <!-- Top Red Chevron Roof -->
    <path d="M 12 35 L 75 4 L 138 35 L 118 45 L 75 23 L 32 45 Z" fill="url(#favRedGrad)" />
    
    <!-- Left Dark Charcoal Side Pillar -->
    <path d="M 12 40 L 30 49 L 30 101 L 12 110 Z" fill="#3A3D40" />
    
    <!-- Right Dark Charcoal Side Pillar -->
    <path d="M 138 40 L 138 110 L 120 101 L 120 49 Z" fill="#3A3D40" />
    
    <!-- Bottom Red Chevron Base -->
    <path d="M 12 115 L 32 105 L 75 127 L 118 105 L 138 115 L 75 146 Z" fill="url(#favRedGrad)" />
    
    <!-- Center Red Bull Head Icon -->
    <g>
      <!-- Smooth Curving Horns and Head -->
