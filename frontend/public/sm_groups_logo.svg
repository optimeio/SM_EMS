<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 160" width="100%" height="100%">
  <defs>
    <linearGradient id="redHexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ED1C24"/>
      <stop offset="100%" stop-color="#C1121F"/>
    </linearGradient>
    <linearGradient id="bullHeadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7A0006"/>
      <stop offset="40%" stop-color="#D90429"/>
      <stop offset="100%" stop-color="#900C3F"/>
    </linearGradient>
    <linearGradient id="smTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF233C"/>
      <stop offset="100%" stop-color="#7209B7"/>
    </linearGradient>
  </defs>

  <!-- LEFT HEXAGON ICON -->
  <g transform="translate(15, 5)">
    <!-- Top Red Chevron Roof -->
    <path d="M 12 35 L 75 4 L 138 35 L 118 45 L 75 23 L 32 45 Z" fill="url(#redHexGrad)" />
    
    <!-- Left Dark Charcoal Side Pillar -->
    <path d="M 12 40 L 30 49 L 30 101 L 12 110 Z" fill="#3A3D40" />
    
    <!-- Right Dark Charcoal Side Pillar -->
    <path d="M 138 40 L 138 110 L 120 101 L 120 49 Z" fill="#3A3D40" />
    
    <!-- Bottom Red Chevron Base -->
    <path d="M 12 115 L 32 105 L 75 127 L 118 105 L 138 115 L 75 146 Z" fill="url(#redHexGrad)" />
    
    <!-- Center Red Bull Head Icon -->
    <g transform="translate(0, 0)">
      <!-- Smooth Curving Horns and Head -->
      <path d="M 32 55 C 50 55, 62 65, 75 80 C 88 65, 100 55, 118 55 C 102 62, 90 75, 75 88 C 60 75, 48 62, 32 55 Z" fill="url(#bullHeadGrad)" />
      <!-- Snout extension -->
      <path d="M 66 78 C 72 85, 75 96, 75 102 C 75 96, 78 85, 84 78 C 78 82, 72 82, 66 78 Z" fill="#900C3F" />
    </g>
  </g>

  <!-- RIGHT LOGO TEXT -->
  <g transform="translate(170, 0)">
    <!-- THE -->
    <text x="0" y="32" font-family="'Courier New', Courier, monospace, serif" font-size="13" font-weight="900" fill="#2B2D42" letter-spacing="1">THE</text>
    
    <!-- SM GROUPS -->
    <text x="0" y="90" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="900" letter-spacing="0.5">
      <tspan fill="#ED1C24">S</tspan>
      <tspan fill="#800F2F">M</tspan>
      <tspan fill="#3A3D40"> GROUPS</tspan>
    </text>
    
    <!-- Underline & Slogan -->
    <line x1="0" y1="108" x2="135" y2="108" stroke="#A51C24" stroke-width="2" />
    <text x="145" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="bold" fill="#3A3D40" font-style="italic">Behind a thing</text>
    <line x1="275" y1="108" x2="415" y2="108" stroke="#A51C24" stroke-width="2" />
  </g>
</svg>
